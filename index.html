            <script>
                var validatedList = [];
                // URL Google Apps Script
                var apiUrl = "https://script.google.com/macros/s/AKfycbxuu1yNtarDQcH3L80bw9OCvtKrzGTMKc8vimdAeaq0dlm519bXtNJblTJJkr6x-Q9RRw/exec?action=read";

                // 1. Au chargement : Récupérer la liste fraîche depuis Google Sheets
                fetch(apiUrl)
                .then(r => r.json())
                .then(data => {
                    validatedList = data;
                    console.log("Synchro Auto : " + data.length + " commerces valides recuperes.");
                    updateAllButtons(); // Appliquer immédiatement
                })
                .catch(err => console.error("Erreur synchro auto :", err));

                // 2. Fonction pour passer les boutons en vert
                function updateAllButtons() {
                    var buttons = document.querySelectorAll('button[data-key]');
                    buttons.forEach(function(btn) {
                        var key = btn.getAttribute('data-key');
                        // Si le commerce est dans la liste des validés
                        if (validatedList.includes(key)) {
                            if (btn.innerHTML !== 'VALIDE') {
                                btn.innerHTML = 'VALIDE';
                                btn.disabled = true;
                                btn.style.background = '#27ae60';
                                btn.style.pointerEvents = 'none';
                            }
                        }
                    });
                }

                // 3. Surveiller l'ouverture des popups (car Leaflet crée le HTML dynamiquement)
                var observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.addedNodes.length) {
                            // Dès qu'un popup s'ouvre, on vérifie son bouton
                            updateAllButtons();
                        }
                    });
                });

                // Démarrer la surveillance sur toute la page
                document.addEventListener("DOMContentLoaded", function() {
                    observer.observe(document.body, { childList: true, subtree: true });
                });
            </script>
