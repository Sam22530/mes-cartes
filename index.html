            <script>
                var statusData = {}; // Stocke les statuts locaux
                var apiUrl = "https://script.google.com/macros/s/AKfycbxuu1yNtarDQcH3L80bw9OCvtKrzGTMKc8vimdAeaq0dlm519bXtNJblTJJkr6x-Q9RRw/exec";

                // 1. Fonction appelée par les boutons (Envoi)
                function updateCommerce(nom, ville, etat, key) {
                    var btns = getButtonsForKey(key);
                    // Feedback visuel immediat
                    btns.valider.innerText = "Wait...";
                    btns.refuser.innerText = "Wait...";

                    // Appel API avec paramètre 'etat'
                    var url = apiUrl + "?commerce=" + encodeURIComponent(nom) + "&ville=" + encodeURIComponent(ville) + "&etat=" + etat;
                    
                    fetch(url)
                    .then(r => r.json())
                    .then(d => {
                        console.log("Reponse:", d);
                        // On met à jour le statut local
                        statusData[key] = etat;
                        applyStyles(key, etat);
                    })
                    .catch(err => {
                        alert("Erreur connexion: " + err);
                        // Reset style si erreur
                        applyStyles(key, ""); 
                    });
                }

                // 2. Fonction appelée au chargement (Lecture)
                function fetchAllStatus() {
                    fetch(apiUrl + "?action=read")
                    .then(r => r.json())
                    .then(data => {
                        // Si c'est une liste (vieux format), on convertit
                        if (Array.isArray(data)) {
                            data.forEach(k => statusData[k] = "VALIDE");
                        } else {
                            statusData = data;
                        }
                        console.log("Donnees chargees:", Object.keys(statusData).length);
                        updateAllButtons();
                    })
                    .catch(e => console.error("Erreur read:", e));
                }

                // 3. Applique les styles aux boutons d'un commerce
                function applyStyles(key, etat) {
                    var btns = getButtonsForKey(key);
                    if(!btns.valider) return;

                    // Reset
                    btns.valider.disabled = false;
                    btns.refuser.disabled = false;
                    btns.valider.style.opacity = "1";
                    btns.refuser.style.opacity = "1";
                    btns.valider.innerText = "VALIDER";
                    btns.refuser.innerText = "REFUSER";
                    btns.valider.style.background = "#e67e22"; // Orange defaut
                    btns.refuser.style.background = "#c0392b"; // Rouge defaut

                    if (etat === "VALIDE") {
                        btns.valider.innerText = "VALIDE";
                        btns.valider.style.background = "#27ae60"; // Vert
                        btns.valider.disabled = true;
                        
                        btns.refuser.style.background = "#bdc3c7"; // Gris
                        btns.refuser.style.opacity = "0.5";
                    } 
                    else if (etat === "REFUSE") {
                        btns.refuser.innerText = "REFUSE";
                        btns.refuser.style.background = "#c0392b"; // Rouge Vif
                        btns.refuser.disabled = true;

                        btns.valider.style.background = "#bdc3c7"; // Gris
                        btns.valider.style.opacity = "0.5";
                    }
                }

                // Helper pour trouver les boutons dans le DOM
                function getButtonsForKey(key) {
                    // On cherche dans tout le document (quand popup ouverte)
                    var v = document.querySelector('button.btn-valider[data-key="' + key + '"]');
                    var r = document.querySelector('button.btn-refuser[data-key="' + key + '"]');
                    return { valider: v, refuser: r };
                }

                // Met à jour tous les boutons visibles (utile lors de l'ouverture popup)
                function updateAllButtons() {
                    var keys = Object.keys(statusData);
                    keys.forEach(k => applyStyles(k, statusData[k]));
                }

                // Surveiller l'ouverture des popups Leaflet
                var observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.addedNodes.length) {
                            updateAllButtons();
                        }
                    });
                });

                document.addEventListener("DOMContentLoaded", function() {
                    fetchAllStatus(); // Lancer la recup
                    observer.observe(document.body, { childList: true, subtree: true });
                });
            </script>
