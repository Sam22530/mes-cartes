            <script>
                var statusData = {}; 
                var apiUrl = "https://script.google.com/macros/s/AKfycbxuu1yNtarDQcH3L80bw9OCvtKrzGTMKc8vimdAeaq0dlm519bXtNJblTJJkr6x-Q9RRw/exec";

                function updateCommerce(nom, ville, etat, key) {
                    var btns = getButtonsForKey(key);
                    
                    // Feedback immédiat
                    if(btns.valider) btns.valider.innerText = "Wait...";
                    if(btns.refuser) btns.refuser.innerText = "Wait...";

                    // URL propre
                    var url = apiUrl + "?commerce=" + encodeURIComponent(nom) + "&ville=" + encodeURIComponent(ville) + "&etat=" + etat;
                    
                    // IMPORTANT: mode 'no-cors' pour ne pas attendre une réponse JSON bloquante
                    fetch(url, { method: "GET", mode: "no-cors" })
                    .then(response => {
                        console.log("Envoi réussi (aveugle) pour: " + nom);
                        statusData[key] = etat;
                        applyStyles(key, etat);
                    })
                    .catch(err => {
                        console.error("Erreur:", err);
                        alert("Erreur réseau. Vérifiez votre connexion.");
                        applyStyles(key, ""); // Reset
                    });
                }

                function fetchAllStatus() {
                    // Ici on garde la lecture standard pour avoir les données au démarrage
                    fetch(apiUrl + "?action=read")
                    .then(r => r.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            data.forEach(k => statusData[k] = "VALIDE");
                        } else {
                            statusData = data;
                        }
                        console.log("Donnees chargees:", Object.keys(statusData).length);
                        updateAllButtons();
                    })
                    .catch(e => console.error("Erreur lecture initiale:", e));
                }

                function applyStyles(key, etat) {
                    var btns = getButtonsForKey(key);
                    if(!btns.valider) return;

                    // Reset style
                    btns.valider.disabled = false;
                    btns.refuser.disabled = false;
                    btns.valider.style.opacity = "1";
                    btns.refuser.style.opacity = "1";
                    btns.valider.innerText = "VALIDER";
                    btns.refuser.innerText = "REFUSER";
                    btns.valider.style.background = "#e67e22"; 
                    btns.refuser.style.background = "#c0392b"; 
                    btns.valider.style.cursor = "pointer";
                    btns.refuser.style.cursor = "pointer";

                    if (etat === "VALIDE") {
                        btns.valider.innerText = "VALIDÉ";
                        btns.valider.style.background = "#27ae60"; 
                        btns.valider.disabled = true;
                        btns.valider.style.cursor = "default";
                        
                        btns.refuser.style.background = "#bdc3c7"; 
                        btns.refuser.style.opacity = "0.3";
                        btns.refuser.disabled = true;
                    } 
                    else if (etat === "REFUSE") {
                        btns.refuser.innerText = "REFUSÉ";
                        btns.refuser.style.background = "#c0392b"; 
                        btns.refuser.disabled = true;
                        btns.refuser.style.cursor = "default";

                        btns.valider.style.background = "#bdc3c7"; 
                        btns.valider.style.opacity = "0.3";
                        btns.valider.disabled = true;
                    }
                }

                function getButtonsForKey(key) {
                    var v = document.querySelector('button.btn-valider[data-key="' + key + '"]');
                    var r = document.querySelector('button.btn-refuser[data-key="' + key + '"]');
                    return { valider: v, refuser: r };
                }

                function updateAllButtons() {
                    var keys = Object.keys(statusData);
                    keys.forEach(k => applyStyles(k, statusData[k]));
                }

                var observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.addedNodes.length) updateAllButtons();
                    });
                });

                document.addEventListener("DOMContentLoaded", function() {
                    fetchAllStatus();
                    observer.observe(document.body, { childList: true, subtree: true });
                });
            </script>
