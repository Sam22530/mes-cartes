        <script>
        function norm(s) {
            if(!s) return "";
            return s.toString().toUpperCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^A-Z0-9]/g, "");
        }

        window.onload = function() {
            console.log("Tentative de lecture Google Sheets...");
            // Ajout d'un timestamp (?t=...) pour éviter que le navigateur utilise une vieille réponse
            fetch("https://script.google.com/macros/s/AKfycbzocFsF-ZwRiBcfEsWj8NMLnnSLT-1caLArQnNXiScLTIEL95nfDpSoMY2KVPw3Mg6KAQ/exec?action=read&t=" + new Date().getTime(), { cache: 'no-store' })
            .then(res => res.json())
            .then(valides => {
                console.log("Liste des validés reçue de Google :", valides);
                document.querySelectorAll('button[data-nom]').forEach(btn => {
                    let key = norm(btn.getAttribute('data-nom')) + "|" + norm(btn.getAttribute('data-ville'));
                    if(valides.includes(key)) {
                        btn.innerHTML = '✅ VALIDÉ';
                        btn.style.background = '#27ae60';
                        btn.disabled = true;
                    }
                });
            })
            .catch(err => console.error("Erreur de synchro :", err));
        };

        function validerCommerce(btn) {
            let nom = btn.getAttribute('data-nom');
            let ville = btn.getAttribute('data-ville');
            btn.innerHTML = '⏳...';
            let url = "https://script.google.com/macros/s/AKfycbzocFsF-ZwRiBcfEsWj8NMLnnSLT-1caLArQnNXiScLTIEL95nfDpSoMY2KVPw3Mg6KAQ/exec?commerce=" + encodeURIComponent(nom) + "&ville=" + encodeURIComponent(ville);
            
            fetch(url).then(r => r.json()).then(d => {
                if(d.status === 'success') {
                    btn.innerHTML = '✅ VALIDÉ';
                    btn.style.background = '#27ae60';
                    btn.disabled = true;
                } else { alert("Erreur: " + d.message); btn.innerHTML = 'VALIDER'; }
            }).catch(err => { alert('Erreur réseau'); btn.innerHTML = 'VALIDER'; });
        }
        </script>
