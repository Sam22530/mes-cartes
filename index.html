        <script>
        function norm(s) {
          return s.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
        }

        window.onload = () => {
          fetch("https://script.google.com/macros/s/AKfycbzxwOgw3wychuqayaTXqVj7qDSjfeXFD_zxQL99QWTZ1bdqobvUCvL9mkdXkK4ecUwxjA/exec?action=read&t=" + Date.now(), {cache:"no-store"})
          .then(r => r.json())
          .then(valides => {
            document.querySelectorAll("button[data-nom]").forEach(btn => {
              let key = norm(btn.dataset.nom) + "|" + norm(btn.dataset.ville);
              if(valides.includes(key)) {
                btn.innerHTML = "✅ VALIDÉ";
                btn.disabled = true;
                btn.style.background = "#27ae60";
              }
            });
          });
        }

        function validerCommerce(btn) {
          fetch("https://script.google.com/macros/s/AKfycbzxwOgw3wychuqayaTXqVj7qDSjfeXFD_zxQL99QWTZ1bdqobvUCvL9mkdXkK4ecUwxjA/exec?commerce=" + encodeURIComponent(btn.dataset.nom) + "&ville=" + encodeURIComponent(btn.dataset.ville))
          .then(r => r.json())
          .then(d => {
            if(d.status === "success" || d.status === "already") {
              btn.innerHTML = "✅ VALIDÉ";
              btn.disabled = true;
              btn.style.background = "#27ae60";
            } else {
              alert("Erreur");
            }
          });
        }
        </script>
