        <script>
        function norm(s) {
            if(!s) return "";
            return s.toString().toUpperCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^A-Z0-9]/g, "");
        }

        window.onload = function() {
            fetch("https://script.google.com/macros/s/AKfycbyXxuKUQ6NK4EMfWZF5mlv36_Q12LC4Cvaugx0w8m9BAJeHWe-Sq0dazWz6GWMjOoENTg/exec?action=read", { cache: 'no-store' })
            .then(res => res.json())
            .then(valides => {
                document.querySelectorAll('button[data-nom]').forEach(btn => {
                    let key = norm(btn.getAttribute('data-nom')) + "|" + norm(btn.getAttribute('data-ville'));
                    if(valides.includes(key)) {
                        btn.innerHTML = '✅ VALIDÉ';
                        btn.style.background = '#27ae60';
                        btn.disabled = true;
                    }
                });
            })
            .catch(err => console.error("Erreur synchro:", err));
        };

        function validerCommerce(btn) {
            let nom = btn.getAttribute('data-nom');
            let ville = btn.getAttribute('data-ville');
            btn.innerHTML = '⏳...';
            btn.disabled = true;

            let url = "https://script.google.com/macros/s/AKfycbyXxuKUQ6NK4EMfWZF5mlv36_Q12LC4Cvaugx0w8m9BAJeHWe-Sq0dazWz6GWMjOoENTg/exec?commerce=" + encodeURIComponent(nom) + "&ville=" + encodeURIComponent(ville);
            
            fetch(url)
            .then(r => r.json())
            .then(d => {
                if(d.status === 'success') {
                    btn.innerHTML = '✅ VALIDÉ';
                    btn.style.background = '#27ae60';
                } else {
                    alert("Erreur: " + d.message);
                    btn.innerHTML = 'VALIDER';
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert('Erreur réseau');
                btn.innerHTML = 'VALIDER';
                btn.disabled = false;
            });
        }
        </script>
